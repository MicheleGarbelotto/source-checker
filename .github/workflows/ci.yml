name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install official skill validator
        run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Pyright
        run: python -m pyright

      - name: Validate Citation Support Audit skill
        run: skills-ref validate skills/citation-support-audit

      - name: Validate Plagiarism Audit skill
        run: skills-ref validate skills/plagiarism-audit

      - name: Verify Citation Support Audit runtime synchronization
        run: python tools/sync_skill_runtime.py --check skills/citation-support-audit

      - name: Verify Plagiarism Audit runtime synchronization
        run: python tools/sync_skill_runtime.py --check skills/plagiarism-audit

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir build/release-check

      - name: Verify wheel contents
        run: >-
          python -c "from pathlib import Path; import zipfile;
          wheels = list(Path('build/release-check').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          names = zipfile.ZipFile(wheels[0]).namelist();
          assert any(name.endswith('.dist-info/METADATA') for name in names), names;
          assert any(name.endswith('.dist-info/licenses/LICENSE') for name in names), names"

      - name: Install built wheel
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheels = list(Path('build/release-check').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall',
          '--no-deps', str(wheels[0])], check=True)"

      - name: Verify installed entry point
        run: source-checker-corpus --help
